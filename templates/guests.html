{% extends "base.html" %}

{% block content %}

<h2 class="mb-4">Guests CRUD</h2>

<div class="card shadow-sm border-0 mb-4">
    <div class="card-header bg-dark text-white">
        Add New Guest
    </div>

    <div class="card-body">
        <form method="POST" action="/guests/add" class="row g-3">
            <div class="col-md-4">
                <input type="text" name="guest_name" class="form-control" placeholder="Guest Name" required>
            </div>

            <div class="col-md-4">
                <input type="email" name="guest_email" class="form-control" placeholder="Guest Email" required>
            </div>

            <div class="col-md-3">
                <input type="text" name="guest_phone" class="form-control" placeholder="Guest Phone" required>
            </div>

            <div class="col-md-1">
                <button type="submit" class="btn btn-primary w-100">Add</button>
            </div>
        </form>
    </div>
</div>

<div class="card shadow-sm border-0">
    <div class="card-header bg-dark text-white">
        Guest List
    </div>

    <div class="card-body">
        <table class="table table-hover align-middle">
            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Email</th>
                <th>Phone</th>
                <th>Action</th>
            </tr>

            {% for g in guests %}
            <tr>
                <form method="POST" action="/guests/update/{{ g.guest_id }}">
                    <td>{{ g.guest_id }}</td>
                    <td><input type="text" name="guest_name" value="{{ g.guest_name }}" class="form-control" required></td>
                    <td><input type="email" name="guest_email" value="{{ g.guest_email }}" class="form-control" required></td>
                    <td><input type="text" name="guest_phone" value="{{ g.guest_phone }}" class="form-control" required></td>
                    <td>
                        <button type="submit" class="btn btn-success btn-sm">Update</button>
                        <a href="/guests/delete/{{ g.guest_id }}" class="btn btn-danger btn-sm">Delete</a>
                    </td>
                </form>
            </tr>
            {% endfor %}
        </table>
    </div>
</div>

{% endblock %}
