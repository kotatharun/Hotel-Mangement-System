<!DOCTYPE html>
<html>
<head>
    <title>Hotel Management System</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
    <div class="container">
        <a class="navbar-brand fw-bold" href="/">Hotel Management</a>

        <div>
            <a class="btn btn-outline-light btn-sm" href="/guests">Guests</a>
            <a class="btn btn-outline-light btn-sm" href="/reservations">Reservations</a>
            <a class="btn btn-outline-light btn-sm" href="/dashboard">Dashboard</a>
        </div>
    </div>
</nav>

<div class="container">

    {% with messages = get_flashed_messages() %}
        {% if messages %}
            {% for message in messages %}
                <div class="alert alert-info">
                    {{ message }}
                </div>
            {% endfor %}
        {% endif %}
    {% endwith %}

    {% block content %}{% endblock %}

</div>

</body>
</html>
